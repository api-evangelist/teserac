aid: teserac
name: Teserac
description: >-
  Teserac is an AI-native infrastructure intelligence company building Neuron™,
  a unified platform for data center observability, intelligence, and workflow
  automation. Neuron ingests telemetry from every system in a facility and
  correlates it across existing DCIM, BMS, EPMS, and ITSM platforms into a
  single intelligence layer, surfacing anomalies before they become incidents to
  protect SLAs and shrink MTTR. Its proprietary Neuron Connect™ technology
  auto-discovers and configures devices and supports protocols including SNMP,
  OPC-UA, MQTT, Redfish, REST APIs, and Niagara/Tridium. Teserac is backed by
  Mayfield. As of this profile the company exposes a marketing site and an
  authenticated product demo (neuron.demo.teserac.ai) but publishes no public
  developer API, OpenAPI specification, SDK, or developer documentation.
